:root{--ink:#171614;--cream:#f2eee5;--amber:#c8913f;--sage:#9aa596}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2048px;height:1152px;overflow:hidden}
body{background:var(--ink);font-family:Archivo,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:
 radial-gradient(1320px 780px at 19% 50%,rgba(200,145,63,.15),transparent 62%),
 radial-gradient(980px 660px at 77% 48%,rgba(154,165,150,.08),transparent 66%)}
.safe{position:absolute;left:251px;top:364.5px;width:1546px;height:423px;
 display:flex;align-items:center;gap:22px}

.copy{width:640px;flex:none}
.eyebrow{font-weight:600;font-size:17px;letter-spacing:.26em;color:var(--sage);
 text-transform:uppercase;margin-bottom:18px}
h1{font-family:Bodoni;font-weight:600;font-size:48px;line-height:1.17;color:var(--cream);
 letter-spacing:-.006em;white-space:nowrap}
h1 em{font-style:normal;color:var(--amber)}
.rule{width:72px;height:2px;background:var(--amber);margin:25px 0 18px}
.get{font-weight:500;font-size:19px;color:rgba(242,238,229,.6)}
.title{font-family:Bodoni;font-weight:600;font-size:31px;color:var(--amber);margin-top:2px}

.card{width:272px;height:404px;flex:none;border-radius:14px;overflow:hidden;position:relative;
 box-shadow:0 20px 44px rgba(0,0,0,.55)}
